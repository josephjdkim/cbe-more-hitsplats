plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.cbemorehitsplats.MoreHitsplatsPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.cbemorehitsplats'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Launches RuneLite in developer mode with this plugin loaded: ./gradlew run
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Runs RuneLite in developer mode with this plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea'
	// Use a profile without the Plugin Hub copy installed, or both copies run. Override with -PruneliteProfile=...
	args '--developer-mode', '--debug', "--profile=${findProperty('runeliteProfile') ?: 'More Hitsplats Dev'}"
}
