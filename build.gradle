plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.cbemorehitsplats'
version = 'v1.0.0'
sourceCompatibility = '1.8'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

// Launches RuneLite in developer mode with this plugin loaded: ./gradlew run
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Runs RuneLite in developer mode with this plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.cbemorehitsplats.MoreHitsplatsPluginTest'
	jvmArgs '-ea'
	// Use a profile without the Plugin Hub copy installed, or both copies run. Override with -PruneliteProfile=...
	args '--developer-mode', "--profile=${findProperty('runeliteProfile') ?: 'More Hitsplats Dev'}"
}
